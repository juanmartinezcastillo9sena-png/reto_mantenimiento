<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar · Sistema de inventario</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="barra">
      <a class="marca" href="index.html">Sistema de inventario</a>
      <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a class="actual" href="registrar.html">Registrar</a>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <h1>Registrar producto</h1>
    <p class="resumen">Completa los datos para agregar un producto al inventario.</p>

    <form id="form-producto" class="tarjeta" action="productos.html" method="get" novalidate>
      <input type="hidden" id="id-producto" name="id" value="">

      <div class="campo">
        <label for="nombre">Nombre del producto</label>
        <p id="ayuda-nombre" class="ayuda">Ingresa el nombre comercial del producto.</p>
        <input type="text" id="nombre" name="nombre" aria-describedby="ayuda-nombre" required>
      </div>

      <div class="campo">
        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" min="1" step="any" required>
      </div>

      <div class="campo">
        <label for="cantidad">Cantidad disponible</label>
        <input type="number" id="cantidad" name="cantidad" min="0" step="1" required>
      </div>

      <div class="campo">
        <label for="estado">Estado</label>
        <select id="estado" name="estado" required>
          <option value="">Seleccione...</option>
          <option value="Activo">Activo</option>
          <option value="Disponible">Disponible</option>
          <option value="Inactivo">Inactivo</option>
          <option value="Sin Stock">Sin Stock</option>
        </select>
      </div>

      <div class="campo">
        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria_id" required>
          <option value="">Seleccione...</option>
        </select>
      </div>

      <div class="acciones">
        <button type="submit" id="btn-guardar" class="btn">Guardar</button>
        <a class="btn btn-secundario" href="productos.html">Cancelar</a>
      </div>
    </form>
  </main>

  <footer class="pie">Sistema de inventario · ADSO</footer>
  <script src="assets/js/datos.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
